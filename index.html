<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will Udall — Down the Valley</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #111111;
      --color-muted: #333333;
      --color-accent: #00796b;
      --color-accent-hover: #005b4f;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-block-size: 100dvb;
      display: flex;
      flex-direction: column;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .visually-hidden {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    .site-header {
      inline-size: 100%;
    }

    .banner-image {
      display: block;
      inline-size: 100%;
      block-size: auto;
      aspect-ratio: 975 / 180;
      object-fit: cover;
    }

    .main-content {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      inline-size: 100%;
      max-inline-size: 1120px;
      margin-inline: auto;
      padding-block: clamp(3rem, 7vw, 5.5rem) clamp(2rem, 5vw, 3.5rem);
      padding-inline: 1.5rem;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(2.5rem, 5vw, 4rem);
      inline-size: 100%;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .link-card__anchor {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 1.35rem;
      color: var(--color-text);
      text-decoration: none;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    .link-card__icon {
      display: block;
      inline-size: 46px;
      block-size: 46px;
      color: var(--color-accent);
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .link-card__title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    .link-card__anchor:hover .link-card__icon,
    .link-card__anchor:focus-visible .link-card__icon {
      color: var(--color-accent-hover);
      transform: translateY(-2px);
    }

    .link-card__anchor:hover .link-card__title {
      color: var(--color-accent);
    }

    .link-card__description {
      margin: 0.65rem 0 0;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      line-height: 1.85;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
      max-inline-size: 28ch;
    }

    .social-nav {
      margin-block-start: clamp(3.5rem, 8vw, 6rem);
    }

    .social-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-inline-size: 36px;
      min-block-size: 36px;
      color: var(--color-text);
      border-radius: 50%;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      color: var(--color-accent);
      transform: translateY(-2px);
    }

    .social-link svg {
      display: block;
      inline-size: 20px;
      block-size: 20px;
    }

    :where(a:any-link):focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
    }

    .site-footer {
      padding-block: 1rem 2.5rem;
      padding-inline: 1.5rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
    }

    @media (max-width: 720px) {
      .links-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link-card__icon,
      .social-link {
        transition: none;
      }

      .link-card__anchor:hover .link-card__icon,
      .link-card__anchor:focus-visible .link-card__icon,
      .social-link:hover,
      .social-link:focus-visible {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <img
      class="banner-image"
      src="assets/band-camp-banner.jpg"
      alt="Will Udall — Down the Valley"
      width="975"
      height="180"
      fetchpriority="high"
    >
  </header>

  <main class="main-content">
    <h1 class="visually-hidden">Will Udall — Down the Valley</h1>

    <ul class="links-grid" role="list">
      <li class="link-card">

          <svg class="link-card__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5v-1a7 7 0 0 1 14 0v1h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9Z"/>

          The best place to buy/listen<br>and support my music

      </li>

      <li class="link-card">
        <a class="link-card__anchor" href="https://www.youtube.com/@willudallmusic/videos" target="_blank" rel="noopener noreferrer">
          <svg class="link-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M7.5 5 5.5 10"/>
            <path d="M12.5 5l-2 5"/>
            <path d="M17.5 5l-2 5"/>
          </svg>
          <span class="link-card__title">YouTube</span>
        </a>
        <p class="link-card__description">
          Check out my music videos
        </p>
      </li>

      <li class="link-card">
        <a class="link-card__anchor" href="mailto:will@willudall.com">
          <svg class="link-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4.5 21 12 3 19.5l3-7.5-3-7.5Z"/>
            <path d="M6 12h15"/>
          </svg>
          <span class="link-card__title">Email</span>
        </a>
        <p class="link-card__description">
          Get in touch
        </p>
      </li>
    </ul>

    <nav class="social-nav" aria-label="Social media">
      <ul class="social-list" role="list">
        <li>
          <a class="social-link" href="https://www.facebook.com/willudallmusic" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.04c-5.5 0-10 4.49-10 10.02 0 5 3.66 9.15 8.44 9.9v-7H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33v7a10 10 0 0 0 8.44-9.9c0-5.53-4.5-10.02-10-10.02Z"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="social-link" href="https://www.instagram.com/willudall" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="social-link" href="https://www.tiktok.com/willudall" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M16.6 5.82s.51.5 0 0A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48Z"/>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026</p>
  </footer>
</body>
</html>
